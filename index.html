<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>    
<body>

    <div class="contaier">
        <h2>Password Generator</h2>
        <input type="text" id="password" readonly>

        <label>Password leghth:</label>
        <input type="number" id="length" value="8" min="4" max="20">
        
        <div class="options">
            <label>
                <input type="checkbox" id="uppercase"> Uppercase
            </label>
        
            <label>
                <input type="checkbox" id="lowercase"> Lowercase
            </label>
        
            <label>
                <input type="checkbox" id="numbers"> Numbers
            </label>
        
            <label>
                <input type="checkbox" id="symbols"> Symbols
            </label>
        </div>

        <button onclick="generatePassword()">Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
